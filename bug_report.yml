name: Reportar un error
description: Algo no funciona como debería.
title: "[Error] "
labels: ["error", "por revisar"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por reportarlo. No incluyas datos reales de estudiantes ni de empresas.
  - type: dropdown
    id: lado
    attributes:
      label: ¿En qué lado de la plataforma pasa?
      options:
        - Estudiante
        - Universidad
        - Empresa
        - No estoy seguro
    validations:
      required: true
  - type: textarea
    id: que-paso
    attributes:
      label: Qué pasó
      description: Describe el error.
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Qué esperabas que pasara
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Entra a «Para ti»
        2. Desliza una oferta a la izquierda
        3. ...
    validations:
      required: true
  - type: input
    id: dispositivo
    attributes:
      label: Dispositivo y navegador
      placeholder: "iPhone 14, Safari"
  - type: textarea
    id: capturas
    attributes:
      label: Capturas de pantalla
